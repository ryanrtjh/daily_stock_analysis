<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark">
<meta name="theme-color" content="#000000">
<title>US Watchlist</title>
<style>
/* Bloomberg-terminal theme: black field, amber chrome, hard edges, monospace, dense data */
:root,:root[data-theme]{
  color-scheme:dark;
  --page:#000; --surface:#050505; --ink:#ff9d00; --ink2:#e8e8e8; --muted:#9a9a9a;
  --grid:#262626; --axis:#444; --border:#3a3a3a; --wash:rgba(255,157,0,.09);
  --series:#fff; --blue:#1d6fd6; --navy:#08183a; --amber:#ff9d00; --amber-hi:#ffb733;
  --good:#00b84a; --good-text:#2bd96b; --warn:#ffd400; --warn-text:#ffd400; --crit:#e8212b; --crit-text:#ff4b4b;
  --on-fill:#000; --on-warn:#000;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;border-radius:0 !important}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--page);color:var(--ink2);
  font:13px/1.35 "Arial Narrow",Arial,"Helvetica Neue",sans-serif;font-stretch:condensed;
  padding-bottom:calc(46px + env(safe-area-inset-bottom))}
.wrap{max-width:1100px;margin:0 auto;padding:0 10px}
header{position:sticky;top:0;z-index:5;background:#000;border-bottom:2px solid var(--amber);
  padding:calc(6px + env(safe-area-inset-top)) 0 6px}
header .wrap{display:flex;align-items:center;gap:10px}
h1{font-size:15px;margin:0;font-weight:700;color:#fff;background:var(--blue);padding:2px 10px;text-transform:uppercase;letter-spacing:.08em;display:inline-block}
.sub{color:var(--muted);font-size:11px;text-transform:uppercase;letter-spacing:.05em}
.grow{flex:1;min-width:0}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
.iconbtn{min-width:40px;min-height:36px;font-size:16px;color:var(--amber);border:1px solid var(--axis)}
.iconbtn:hover,.chip:hover{background:var(--wash)}
nav{position:fixed;bottom:0;left:0;right:0;z-index:6;background:var(--navy);border-top:2px solid var(--amber);
  padding-bottom:env(safe-area-inset-bottom)}
nav .wrap{display:grid;grid-template-columns:repeat(6,1fr);padding:0;gap:2px;background:var(--navy)}
nav button{padding:6px 2px;min-height:40px;display:flex;flex-direction:row;justify-content:center;align-items:center;gap:6px;
  font-size:11px;color:#fff;background:#2b2b2b;text-transform:uppercase;letter-spacing:.06em;font-weight:700;border:1px solid #555}
nav button .ic{font-size:13px;line-height:1}
nav button[aria-current="page"]{background:var(--amber);color:#000;font-weight:700}
section{display:none;padding:10px 0}
section.on{display:block}
h2{font-size:11px;text-transform:uppercase;letter-spacing:.1em;color:#000;background:var(--amber);margin:14px 0 6px;font-weight:700;padding:2px 8px}
.card{background:var(--surface);border:1px solid var(--border);padding:8px 10px;margin:0 0 6px}
.row{display:flex;align-items:center;gap:10px}
.between{justify-content:space-between}
.tk{font-weight:700;font-size:16px;color:#fff;letter-spacing:.02em}
.nm{color:var(--muted);font-size:11px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-transform:uppercase}
.px{font-size:16px;font-weight:700;text-align:right;color:#fff;font-variant-numeric:tabular-nums}
.chg{font-size:12px;font-weight:700;font-variant-numeric:tabular-nums}
.up{color:var(--good-text)}.dn{color:var(--crit-text)}
.badge{display:inline-flex;align-items:center;gap:5px;padding:1px 8px;font-size:11px;font-weight:700;white-space:nowrap;text-transform:uppercase;letter-spacing:.06em}
.b-BUY{background:var(--good);color:var(--on-fill)}
.b-WATCH{background:var(--blue);color:#fff}
.b-WAIT{background:var(--warn);color:#000}
.b-AVOID{background:var(--crit);color:#fff}
.pill{display:inline-block;padding:1px 6px;font-size:10px;border:1px solid var(--axis);color:var(--amber);text-transform:uppercase;letter-spacing:.05em}
.pill.flag{border-color:var(--crit-text);color:var(--crit-text)}
.setup{font-weight:700;margin:8px 0 2px;color:var(--amber);text-transform:uppercase;font-size:12px;letter-spacing:.04em}
.note{color:var(--ink2);font-size:12.5px;margin:2px 0 8px}
.plan{display:grid;grid-template-columns:repeat(4,1fr);gap:4px;margin:8px 0}
.plan div{background:transparent;border:1px solid var(--amber);padding:3px 8px;min-width:0}
.plan small{display:block;color:var(--muted);font-size:10px;text-transform:uppercase;letter-spacing:.06em}
.plan b{font-size:14px;font-variant-numeric:tabular-nums;word-break:break-word;color:#fff}
.size{font-size:12px;color:var(--ink2);margin:4px 0 8px}
details{margin-top:6px}
summary{cursor:pointer;color:var(--amber);font-size:12px;min-height:28px;display:flex;align-items:center;font-weight:700;list-style:none;text-transform:uppercase;letter-spacing:.05em}
summary::-webkit-details-marker{display:none}
summary.h2{color:#000;background:var(--amber);font-size:11px;text-transform:uppercase;letter-spacing:.1em;margin:14px 0 6px;padding:2px 8px;min-height:0;font-weight:700}
summary.h2::before{font-size:9px}
summary::before{content:"▶";font-size:9px;margin-right:6px;transition:transform .15s}
details[open]>summary::before{transform:rotate(90deg)}
ul.l{margin:6px 0;padding-left:18px}
ul.l li{margin:3px 0;font-size:12.5px}
.kv{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin:8px 0}
.kv div{font-size:10px;color:var(--muted);text-transform:uppercase}.kv b{display:block;color:#fff;font-size:13px;font-variant-numeric:tabular-nums}
.ev{font-size:12px;border-left:3px solid var(--axis);padding:3px 10px;margin:8px 0;color:var(--ink2)}
.ev.bad{border-color:var(--crit)}.ev.good{border-color:var(--good)}
.news a{color:var(--ink2);text-decoration:none;display:block;padding:5px 0;border-top:1px solid var(--grid);font-size:12.5px}
.news a:hover{color:var(--amber-hi)}
.news a small{display:block;color:var(--muted);font-size:11px}
.ai{border:1px dashed var(--amber);padding:8px 10px;margin:8px 0;font-size:12.5px}
.ai h4{margin:0 0 4px;font-size:11px;color:var(--amber);text-transform:uppercase;letter-spacing:.08em}
.banner{display:flex;gap:12px;align-items:center}
.banner .big{font-weight:700;font-size:15px;color:var(--amber);text-transform:uppercase}
.empty{color:var(--muted);text-align:center;padding:22px 8px;font-size:13px}
.tiles{display:grid;grid-template-columns:repeat(2,1fr);gap:6px}
.tile{background:var(--surface);border:1px solid var(--border);padding:8px 10px}
.tile small{color:var(--muted);font-size:10px;text-transform:uppercase;letter-spacing:.08em;display:block}
.tile b{font-size:22px;font-weight:700;color:#fff;font-variant-numeric:tabular-nums}.tile span{display:block;font-size:11px;color:var(--ink2)}
table{width:100%;border-collapse:collapse;font-size:12px}
th,td{white-space:nowrap;padding:4px 8px;text-align:right;border-bottom:1px solid var(--grid);font-variant-numeric:tabular-nums}
tbody tr:hover{background:var(--wash)}
th:first-child,td:first-child{text-align:left}
th{color:#fff;background:#1f1f1f;border-bottom:2px solid var(--amber);font-weight:700;font-size:10px;text-transform:uppercase;letter-spacing:.06em}
.scroll{overflow-x:auto;-webkit-overflow-scrolling:touch}
.chips{display:flex;gap:4px;overflow-x:auto;padding:2px 0 8px;-webkit-overflow-scrolling:touch}
.chip{flex:none;padding:4px 10px;border:1px solid #555;font-size:12px;min-height:30px;background:#2b2b2b;color:#fff;text-transform:uppercase}
.chip[aria-pressed="true"]{background:var(--blue);color:#fff;border-color:#6fa8ff;font-weight:700}
.grid{display:grid;gap:2px;font-size:11px}
.cell{height:24px;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:11px}
.cell.BUY{background:var(--good);color:#000}.cell.WATCH{background:var(--blue);color:#fff}
.cell.WAIT{background:var(--warn);color:#000}.cell.AVOID{background:var(--crit);color:#fff}
.cell.none{background:var(--wash)}
.hd{color:var(--muted);text-align:center;font-size:10px}.rl{display:flex;align-items:center;font-weight:700;font-size:12px;color:#fff}
.legend{display:flex;gap:12px;flex-wrap:wrap;font-size:11px;color:var(--ink2);margin:8px 0}
.legend i{font-style:normal;font-weight:700;display:inline-block;min-width:18px;text-align:center;padding:0 3px;margin-right:4px}
input[type=text],input[type=number],select{font:inherit;width:100%;padding:8px 10px;border:1px solid var(--axis);background:#000;color:var(--amber-hi);min-height:38px;text-transform:uppercase}
input:focus,select:focus{outline:1px solid var(--amber)}
.btn{background:var(--amber);color:#000;padding:8px 16px;font-weight:700;min-height:38px;text-transform:uppercase;letter-spacing:.06em}
.btn.ghost{background:none;color:var(--amber);border:1px solid var(--amber)}
.btn:disabled{opacity:.5}
label.f{display:block;font-size:10px;color:var(--muted);margin:10px 0 4px;text-transform:uppercase;letter-spacing:.08em}
dialog{border:1px solid var(--amber);background:#000;color:var(--ink2);width:min(420px,92vw);padding:16px}
dialog::backdrop{background:rgba(0,0,0,.7)}
.tip{position:absolute;pointer-events:none;background:#000;border:1px solid var(--amber);padding:4px 8px;font-size:11px;color:var(--amber-hi);white-space:nowrap;z-index:3}
.chart{position:relative;touch-action:pan-y}
.disclaimer{font-size:10.5px;color:var(--muted);margin:20px 2px 6px;text-align:center;text-transform:uppercase;letter-spacing:.04em}
.spark{display:block;width:100%;height:44px}
.chgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,420px),1fr));gap:8px}
.chcard{background:var(--surface);border:1px solid var(--border);padding:8px 10px;min-width:0}
.chhd{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
.chro{font-size:11px;color:var(--muted);font-variant-numeric:tabular-nums;margin:2px 0 4px;min-height:15px}
.chro b{color:#fff;font-weight:400}
.chsvg{display:block;width:100%;height:auto;touch-action:pan-y}
.chleg{display:flex;gap:12px;flex-wrap:wrap;font-size:11px;color:var(--ink2);margin:6px 0}
.chleg i{display:inline-block;width:14px;height:0;border-top:2px solid;vertical-align:middle;margin-right:4px}
.facts{font-size:12px;color:var(--ink2);margin:3px 0}
.facts b{color:#fff}.facts b.up{color:var(--good-text)}.facts b.dn{color:var(--crit-text)}
.fl{display:inline-block;min-width:78px;font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:.07em}
.tag{display:inline-block;padding:0 6px;font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;border:1px solid var(--axis);color:var(--ink2)}
.tag.up{border-color:var(--good-text);color:var(--good-text)}.tag.dn{border-color:var(--crit-text);color:var(--crit-text)}
@media(max-width:520px){nav button .ic{display:none}nav button{font-size:10px;letter-spacing:0}}
@media(min-width:900px){.tiles{grid-template-columns:repeat(4,1fr)}}
@media(max-width:380px){.plan{grid-template-columns:repeat(2,1fr)}}
@media(forced-colors:active){.badge,.cell{border:1px solid CanvasText}}
</style>
</head>
<body>
<header><div class="wrap">
  <div class="grow"><h1>US Watchlist</h1><div class="sub" id="asof"></div></div>
  <span id="regime"></span>
  <button class="iconbtn" id="gear" aria-label="Settings">⚙</button>
</div></header>

<main class="wrap">
  <section id="s-today" class="on"></section>
  <section id="s-watch"></section>
  <section id="s-ch"></section>
  <section id="s-op"></section>
  <section id="s-hist"></section>
  <section id="s-an"></section>
  <p class="disclaimer">Rule-based technical signals from daily bars, for research. Not financial advice. Past performance does not predict results.</p>
</main>

<nav><div class="wrap" id="tabs"></div></nav>

<dialog id="dlg">
  <form method="dialog">
    <h3 style="margin:0 0 4px">Settings</h3>
    <div class="sub">Saved on this device only.</div>
    <label class="f" for="acct">Account size (USD)</label>
    <input type="number" id="acct" inputmode="decimal" placeholder="e.g. 25000" min="0">
    <label class="f" for="risk">Risk per trade (% of account)</label>
    <input type="number" id="risk" inputmode="decimal" step="0.25" min="0.1" max="5" placeholder="1">
    <div class="row" style="margin-top:16px;justify-content:flex-end"><button class="btn" value="ok">Done</button></div>
  </form>
</dialog>

<script>
const DATA = /*__DATA__*/null;
const L = DATA.latest, H = DATA.history, C = DATA.charts || {}, O = DATA.options || {};
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => [...r.querySelectorAll(s)];
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const num = (v, d = 2) => v == null ? "–" : Number(v).toLocaleString("en-US", {minimumFractionDigits: d, maximumFractionDigits: d});
const usd = v => v == null ? "–" : "$" + num(v);
const pct = (v, d = 1) => v == null ? "–" : (v > 0 ? "+" : "") + num(v, d) + "%";
const cls = v => v > 0 ? "up" : v < 0 ? "dn" : "";
const ICON = {BUY: "▲", WATCH: "◉", WAIT: "⏸", AVOID: "✕"};
const ACT = {BUY: "Buy zone", WATCH: "Watch", WAIT: "Wait", AVOID: "Avoid"};
const badge = a => `<span class="badge b-${a}"><span aria-hidden="true">${ICON[a] || "•"}</span>${ACT[a] || a}</span>`;
const safeUrl = u => /^https?:\/\//i.test(u || "") ? u : null;
const store = { get: (k, d) => { try { return JSON.parse(localStorage.getItem(k)) ?? d } catch { return d } }, set: (k, v) => { try { localStorage.setItem(k, JSON.stringify(v)) } catch {} } };
const S = store.get("dsa.settings", {acct: null, risk: 1, theme: "auto"});

/* ---------- charts ---------- */
function spark(vals, w = 120, h = 44) {
  const v = (vals || []).filter(x => x != null);
  if (v.length < 2) return "";
  const lo = Math.min(...v), hi = Math.max(...v), span = hi - lo || 1, pad = 5;
  const pts = v.map((y, i) => [pad + i * (w - 2 * pad) / (v.length - 1), pad + (hi - y) * (h - 2 * pad) / span]);
  const last = pts[pts.length - 1];
  return `<svg class="spark" viewBox="0 0 ${w} ${h}" preserveAspectRatio="none" role="img" aria-label="60-day price trend, ${num(v[0])} to ${num(v[v.length-1])}">
    <polyline fill="none" stroke="var(--series)" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" vector-effect="non-scaling-stroke" points="${pts.map(p => p.map(n => n.toFixed(1)).join(",")).join(" ")}"/>
    <circle cx="${last[0]}" cy="${last[1]}" r="4" fill="var(--series)" stroke="var(--surface)" stroke-width="2" vector-effect="non-scaling-stroke"/></svg>`;
}

/* ---------- idea card ---------- */
function sizing(i) {
  if (!(i.action === "BUY" || i.action === "WATCH") || i.stop == null) return "";
  const ref = i.trigger ?? (i.entry_low + i.entry_high) / 2, risk = ref - i.stop;
  if (!(risk > 0)) return "";
  if (!S.acct) return `<div class="size">Risk per share ≈ ${usd(risk)} (${num(risk / ref * 100, 1)}%). Set your account size in ⚙ for share counts.</div>`;
  const budget = S.acct * (S.risk || 1) / 100;
  let sh = Math.floor(budget / risk); const cap = Math.floor(S.acct / ref);
  const capped = sh > cap; sh = Math.min(sh, cap);
  return `<div class="size"><b>Size:</b> ≈ ${sh} shares (${usd(sh * ref)}) risks ${usd(sh * risk)} = ${S.risk || 1}% of account${capped ? ", capped at 100% of account" : ""}.</div>`;
}

function aiBlock(i) {
  const a = i.ai;
  if (!a) return L.ai_key_present ? "" : `<div class="ai"><h4>AI commentary</h4>Add an LLM key to <code>.env</code> and rebuild to get an AI read on every ticker (news, risks, catalysts).</div>`;
  return `<div class="ai"><h4>AI read · ${esc(a.advice || "")} ${a.score != null ? "· " + a.score + "/100" : ""}</h4>
    ${a.one_sentence ? `<div><b>${esc(a.one_sentence)}</b></div>` : ""}
    ${a.no_position ? `<div><b>No position:</b> ${esc(a.no_position)}</div>` : ""}${a.has_position ? `<div><b>Holding:</b> ${esc(a.has_position)}</div>` : ""}
    ${a.summary ? `<div style="margin-top:4px;color:var(--ink2)">${esc(a.summary)}</div>` : ""}
    ${(a.risks || []).length ? `<ul class="l">${a.risks.map(r => `<li>⚠ ${esc(r)}</li>`).join("")}</ul>` : ""}
    ${(a.catalysts || []).length ? `<ul class="l">${a.catalysts.map(r => `<li>✓ ${esc(r)}</li>`).join("")}</ul>` : ""}</div>`;
}

const REC = {strong_buy: ["Strong buy", "up"], buy: ["Buy", "up"], hold: ["Hold", ""], underperform: ["Underperform", "dn"], sell: ["Sell", "dn"], strong_sell: ["Strong sell", "dn"]};
function facts(i) {
  const a = i.analyst, p = i.positioning, out = [];
  if (a) {
    const r = REC[a.rec] || [a.rec ? String(a.rec).replace(/_/g, " ") : null, ""], up = a.target_mean && i.price ? (a.target_mean / i.price - 1) * 100 : null;
    out.push(`<div class="facts"><span class="fl">Analysts</span>${r[0] ? `<b class="${r[1]}">${esc(r[0])}</b>${a.rec_mean ? ` (${num(a.rec_mean, 1)}/5)` : ""}` : ""}${a.target_mean ? ` · Target <b>${usd(a.target_mean)}</b> <span class="${cls(up)}">${pct(up)}</span>` : ""}${a.target_low && a.target_high ? ` · Range ${usd(a.target_low)}–${usd(a.target_high)}` : ""}${a.n ? ` · ${a.n} analysts` : ""}</div>`);
  }
  if (p) {
    out.push(`<div class="facts"><span class="fl">Positioning</span>${p.short_pct_float != null ? `Short <b class="${p.short_pct_float >= 10 ? "dn" : ""}">${num(p.short_pct_float, 1)}%</b> of float` : ""}${p.days_to_cover != null ? ` · ${num(p.days_to_cover, 1)}d to cover` : ""}${p.short_chg_pct != null ? ` · <span class="${cls(-p.short_chg_pct)}" title="Short interest vs prior month${p.short_date ? ", as of " + esc(p.short_date) : ""}">${p.short_chg_pct > 0 ? "▲" : "▼"} ${num(Math.abs(p.short_chg_pct), 1)}% m/m</span>` : ""}${p.inst_pct != null ? ` · Institutions <b>${num(p.inst_pct, 1)}%</b>` : ""}${p.insider_pct != null ? ` · Insiders <b>${num(p.insider_pct, 1)}%</b>` : ""}</div>`);
  }
  return out.join("");
}

function card(i, open = false) {
  const planHtml = (i.action === "BUY" || i.action === "WATCH") && i.stop != null ? `
    <div class="plan">
      <div><small>${i.trigger ? "Trigger" : "Entry"}</small><b>${i.trigger ? usd(i.trigger) : usd(i.entry_low) + "–" + num(i.entry_high)}</b></div>
      <div><small>Stop</small><b>${usd(i.stop)}</b></div>
      <div><small>Target</small><b>${usd(i.target)}</b></div>
      <div><small>Reward:risk</small><b>${i.rr != null ? i.rr + " : 1" : "–"}</b></div></div>${sizing(i)}`
    : (i.action === "WAIT" && i.entry_low != null ? `<div class="plan" style="grid-template-columns:1fr 1fr 1fr"><div><small>Buy-the-dip zone</small><b>${usd(i.entry_low)}–${num(i.entry_high)}</b></div><div><small>Stop (if entered)</small><b>${usd(i.stop)}</b></div><div><small>Target</small><b>${usd(i.target)}</b></div></div>` : "");
  const flags = [...(i.flags || [])].map(f => `<span class="pill flag">⚠ ${esc(f)}</span>`).join(" ");
  const lv = i.levels || {};
  return `<article class="card" data-code="${esc(i.code)}">
    <div class="row between"><div class="grow"><div class="tk">${esc(i.code)}</div><div class="nm">${esc(i.name)}${i.sector ? " · " + esc(i.sector) : ""}</div></div>
      <div style="width:84px">${spark(i.spark)}</div>
      <div><div class="px">${usd(i.price)}</div><div class="chg ${cls(i.chg_pct)}" style="text-align:right">${i.chg_pct > 0 ? "▲" : i.chg_pct < 0 ? "▼" : ""} ${pct(i.chg_pct)}</div></div></div>
    <div class="row" style="margin-top:10px;flex-wrap:wrap;gap:6px">${badge(i.action)}<span class="pill">${esc(i.conviction)} conviction</span>${i.earnings_days != null && i.earnings_days <= 14 ? `<span class="pill ${i.earnings_days <= 7 ? "flag" : ""}">Earnings ${esc(i.earnings_date)}</span>` : ""}${flags}</div>
    <div class="setup">${esc(i.label)}</div><div class="note">${esc(i.note)}</div>
    ${facts(i)}
    ${planHtml}
    <details ${open ? "open" : ""}><summary>Why &amp; risks</summary>
      ${(i.reasons || []).length ? `<ul class="l">${i.reasons.map(r => `<li>${esc(r)}</li>`).join("")}</ul>` : ""}
      ${(i.risks || []).length ? `<ul class="l">${i.risks.map(r => `<li>⚠ ${esc(r)}</li>`).join("")}</ul>` : ""}
      <div class="kv"><div>Trend<b>${esc(i.trend)}</b></div><div>RSI(12)<b>${num(lv.rsi, 0)}</b></div><div>Volume<b>${lv.vol_ratio != null ? lv.vol_ratio + "× avg" : "–"}</b></div>

async function wlCall(action, symbol) {
  const msg = $("#wl-msg"), btns = $$("#s-watch button, #s-watch input");
  msg.textContent = action === "add" ? `Checking ${symbol} and rebuilding… (5-15s)` : `Removing ${symbol} and rebuilding…`;
  btns.forEach(b => b.disabled = true);
  try {
    const r = await fetch("/api/watchlist", {method: "POST", headers: {"Content-Type": "application/json"}, body: JSON.stringify({action, symbol})});
    const j = await r.json();
    if (!r.ok) throw new Error(j.error || "request failed");
    location.hash = "#watch"; location.reload();
  } catch (e) {
    msg.textContent = "Couldn't " + action + " " + symbol + ": " + e.message;
    btns.forEach(b => b.disabled = false);

const sma = (a, n) => a.map((_, i) => i < n - 1 ? null : a.slice(i - n + 1, i + 1).reduce((s, v) => s + v, 0) / n);
const kfmt = v => v >= 1e9 ? (v / 1e9).toFixed(2) + "B" : v >= 1e6 ? (v / 1e6).toFixed(1) + "M" : v >= 1e3 ? Math.round(v / 1e3) + "K" : String(v);
const CH_RANGES = ["1M", "3M", "6M", "YTD", "1Y", "3Y"];
let CH_RANGE = "6M", CH_MA = true, CH_MA2 = false, CH_TYPE = "candle";
const MA200_COL = "#3ec9ff";
function rangeBars(bars, key) {   // how many of the latest daily bars a range covers
  const last = bars.length - 1;
  if (key === "YTD") { const yr = bars[last][0].slice(0, 4), i = bars.findIndex(b => b[0].slice(0, 4) === yr); return Math.max(5, bars.length - i); }
  return Math.min(bars.length, {"1M": 21, "3M": 63, "6M": 126, "1Y": 252, "3Y": 756}[key]);
}
function weekly(vis) {   // collapse daily bars into weekly candles (keeps the 3Y view readable and fast)
  const out = [], wk = d => { const t = new Date(d + "T00:00:00Z"); t.setUTCDate(t.getUTCDate() - (t.getUTCDay() + 6) % 7); return t.toISOString().slice(0, 10); };
  let cur = null, key = "";
  vis.forEach(b => { const k = wk(b[0]);
    if (k !== key) { cur = [b[0], b[1], b[2], b[3], b[4], b[5], b[6]]; out.push(cur); key = k; }
    else { cur[0] = b[0]; cur[2] = Math.max(cur[2], b[2]); cur[3] = Math.min(cur[3], b[3]); cur[4] = b[4]; cur[5] += b[5]; cur[6] = b[6]; } });
  return out;
}

function candleChart(el, idea) {
  const bars = C[idea.code] || [];
  if (bars.length < 5) { el.innerHTML = '<div class="empty">No chart data.</div>'; return; }
  const W = 560, Ht = 250, m = {l: 6, r: 50, t: 8, b: 18};
  const closes = bars.map(b => b[4]), m20 = sma(closes, 20), m50 = sma(closes, 50), m200 = sma(closes, 200);
  const days = rangeBars(bars, CH_RANGE), agg = days > 260 && CH_TYPE === "candle";   // 3Y candles are collapsed to weekly; the line stays daily
  let v = bars.slice(bars.length - days).map((b, i) => [...b, bars.length - days + i]);   // 7th field = index into the daily arrays (for MAs)
  if (agg) v = weekly(v);
  const n = v.length;
  const hiI = CH_TYPE === "line" ? 4 : 2, loI = CH_TYPE === "line" ? 4 : 3;
  let hi = Math.max(...v.map(b => b[hiI])), lo = Math.min(...v.map(b => b[loI]));
  const r0 = hi - lo, levels = [];
  if ((idea.action === "BUY" || idea.action === "WATCH") && idea.stop != null) {
    [["Stop", idea.stop, "var(--crit-text)"], ["Target", idea.target, "var(--good-text)"], [idea.trigger ? "Trigger" : "Entry", idea.trigger ?? idea.entry_high, "var(--amber)"]]
      .forEach(([l, p, c]) => { if (p != null && p > lo - r0 * 0.3 && p < hi + r0 * 0.3) levels.push({l, p, c}); });
  }
  levels.forEach(x => { hi = Math.max(hi, x.p); lo = Math.min(lo, x.p); });
  const pad = (hi - lo) * 0.05 || 1; hi += pad; lo -= pad;
  const inner = Ht - m.t - m.b, volH = inner * 0.16, ph = inner - volH - 4, pw = W - m.l - m.r, step = pw / n, cw = Math.max(1.5, step * 0.68);
  const x = i => m.l + (i + 0.5) * step, y = p => m.t + (hi - p) / (hi - lo) * ph;
  const vmax = Math.max(...v.map(b => b[5])) || 1, vy = q => Ht - m.b - q / vmax * volH;
  const ticks = [0, 1, 2, 3, 4].map(k => lo + (hi - lo) * k / 4);
  const up = "var(--good-text)", dn = "var(--crit-text)";
  const grid = ticks.map(p => `<line x1="${m.l}" x2="${W - m.r}" y1="${y(p).toFixed(1)}" y2="${y(p).toFixed(1)}" stroke="var(--grid)"/><text x="${W - m.r + 4}" y="${(y(p) + 3).toFixed(1)}" font-size="10" fill="var(--muted)">${p >= 100 ? p.toFixed(0) : p.toFixed(2)}</text>`).join("");
  const vols = v.map((b, i) => { const col = b[4] >= b[1] ? up : dn;
    return `<rect x="${(x(i) - cw / 2).toFixed(1)}" y="${vy(b[5]).toFixed(1)}" width="${cw.toFixed(1)}" height="${(Ht - m.b - vy(b[5])).toFixed(1)}" fill="${col}" opacity=".35"/>`; }).join("");
  const price = CH_TYPE === "line"
    ? (() => { const col = v[n - 1][4] >= v[0][4] ? up : dn, pts = v.map((b, i) => `${x(i).toFixed(1)},${y(b[4]).toFixed(1)}`).join(" ");
        return `<polygon points="${x(0).toFixed(1)},${m.t + ph} ${pts} ${x(n - 1).toFixed(1)},${m.t + ph}" fill="${col}" opacity=".12"/><polyline fill="none" stroke="${col}" stroke-width="1.6" stroke-linejoin="round" points="${pts}"/>`; })()
    : v.map((b, i) => { const [, o, h, l, c] = b, col = c >= o ? up : dn, top = y(Math.max(o, c)), bh = Math.max(1, Math.abs(y(o) - y(c)));
        return `<line x1="${x(i).toFixed(1)}" x2="${x(i).toFixed(1)}" y1="${y(h).toFixed(1)}" y2="${y(l).toFixed(1)}" stroke="${col}"/><rect x="${(x(i) - cw / 2).toFixed(1)}" y="${top.toFixed(1)}" width="${cw.toFixed(1)}" height="${bh.toFixed(1)}" fill="${col}"/>`; }).join("");
  const line = (arr, col) => { const pts = v.map((b, i) => arr[b[6]] == null ? null : `${x(i).toFixed(1)},${y(arr[b[6]]).toFixed(1)}`).filter(Boolean); return pts.length > 1 ? `<polyline fill="none" stroke="${col}" stroke-width="1.2" points="${pts.join(" ")}"/>` : ""; };
  const lv = levels.map(q => `<line x1="${m.l}" x2="${W - m.r}" y1="${y(q.p).toFixed(1)}" y2="${y(q.p).toFixed(1)}" stroke="${q.c}" stroke-dasharray="5 3"/><text x="${m.l + 3}" y="${(y(q.p) - 3).toFixed(1)}" font-size="10" fill="${q.c}">${q.l} ${q.p.toFixed(2)}</text>`).join("");
  const dl = [0, Math.floor(n / 2), n - 1].map((i, k) => `<text x="${k === 0 ? m.l : k === 2 ? W - m.r : x(i)}" y="${Ht - 4}" font-size="10" fill="var(--muted)" text-anchor="${k === 0 ? "start" : k === 2 ? "end" : "middle"}">${v[i][0].slice(2)}</text>`).join("");
  const last = bars[bars.length - 1], prev = bars[bars.length - 2] || last, chg = (last[4] / prev[4] - 1) * 100;
  el.innerHTML = `<div class="chhd"><span class="tk">${esc(idea.code)}</span><span class="px">${usd(last[4])}</span><span class="chg ${cls(chg)}">${pct(chg)}</span>${badge(idea.action)}</div>
    <div class="chro"></div>
    <svg class="chsvg" viewBox="0 0 ${W} ${Ht}" role="img" aria-label="${esc(idea.code)} ${CH_TYPE === "line" ? "line" : agg ? "weekly candlestick" : "daily candlestick"} chart, ${CH_RANGE}">${grid}${vols}${price}${CH_MA || CH_MA2 ? `<clipPath id="cp-${esc(idea.code)}"><rect x="${m.l}" y="${m.t}" width="${pw}" height="${ph}"/></clipPath><g clip-path="url(#cp-${esc(idea.code)})">${CH_MA2 ? line(m200, MA200_COL) : ""}${line(m50, "var(--series)")}${CH_MA ? line(m20, "var(--amber)") : ""}</g>` : ""}${lv}${dl}<line class="xh" y1="${m.t}" y2="${Ht - m.b}" stroke="var(--muted)" style="display:none"/><rect class="hit" x="${m.l}" y="0" width="${pw}" height="${Ht}" fill="transparent"/></svg>`;
  const ro = $(".chro", el), svg = $("svg", el), xh = $(".xh", el);
  const show = b => { ro.innerHTML = `<b>${agg ? "wk to " : ""}${b[0]}</b> O ${b[1].toFixed(2)} H ${b[2].toFixed(2)} L ${b[3].toFixed(2)} C <b>${b[4].toFixed(2)}</b> Vol ${kfmt(b[5])}`; };
  show(last);
  const move = e => { const r = svg.getBoundingClientRect(), i = Math.max(0, Math.min(n - 1, Math.floor(((e.clientX - r.left) * W / r.width - m.l) / step)));
    xh.style.display = ""; xh.setAttribute("x1", x(i)); xh.setAttribute("x2", x(i)); show(v[i]); };
  $(".hit", el).addEventListener("pointermove", move);
  $(".hit", el).addEventListener("pointerleave", () => { xh.style.display = "none"; show(last); });
}

function ratioTag(imp, past) {
  if (imp == null || !past) return "";
  const r = imp / past;
  return r >= 1.25 ? `<span class="tag dn" title="Options price a bigger move than past reports delivered">Rich ${r.toFixed(1)}×</span>` : r <= 0.8 ? `<span class="tag up" title="Options price a smaller move than past reports delivered">Cheap ${r.toFixed(1)}×</span>` : `<span class="tag">Fair ${r.toFixed(1)}×</span>`;
}
const impTxt = o => o.implied_move_pct != null ? (o.move_quality === "rough" ? "~" : "") + "±" + num(o.implied_move_pct, 1) + "%" : "–";

function ivChart(o) {
  const T = o.term, n = T.length, W = 560, Ht = 176, m = {l: 34, r: 10, t: 16, b: 32}, step = (W - m.l - m.r) / n;
  const ivs = T.map(t => t.iv), lo = Math.min(...ivs), hi = Math.max(...ivs), pad = (hi - lo) * 0.25 || 2, y0 = Math.max(0, lo - pad), y1 = hi + pad;
  const x = i => m.l + (i + 0.5) * step, y = v => m.t + (y1 - v) / (y1 - y0) * (Ht - m.t - m.b);
  const grid = [y0, (y0 + y1) / 2, y1].map(v => `<line x1="${m.l}" x2="${W - m.r}" y1="${y(v).toFixed(1)}" y2="${y(v).toFixed(1)}" stroke="var(--grid)"/><text x="${m.l - 4}" y="${(y(v) + 3).toFixed(1)}" font-size="10" fill="var(--muted)" text-anchor="end">${v.toFixed(0)}%</text>`).join("");
  const pts = T.map((t, i) => `${x(i).toFixed(1)},${y(t.iv).toFixed(1)}`).join(" ");
  const dots = T.map((t, i) => `<circle cx="${x(i).toFixed(1)}" cy="${y(t.iv).toFixed(1)}" r="3.2" fill="var(--amber)"/><text x="${x(i).toFixed(1)}" y="${(y(t.iv) - 7).toFixed(1)}" font-size="10" fill="#fff" text-anchor="middle">${t.iv.toFixed(0)}</text><text x="${x(i).toFixed(1)}" y="${Ht - 17}" font-size="10" fill="var(--ink2)" text-anchor="middle">${t.exp.slice(5)}</text><text x="${x(i).toFixed(1)}" y="${Ht - 5}" font-size="9" fill="var(--muted)" text-anchor="middle">${t.dte}d</text>`).join("");
  let em = "";
  if (o.earnings_days != null && o.earnings_days >= 0) {   // place the earnings marker between the expiries it falls between
    let k = T.findIndex(t => t.dte > o.earnings_days), pos;
    if (k === -1) pos = null; else if (k === 0) pos = -0.35; else pos = k - 1 + (o.earnings_days - T[k - 1].dte) / (T[k].dte - T[k - 1].dte);
    if (pos != null) { const ex = x(Math.max(-0.35, pos)); em = `<line x1="${ex.toFixed(1)}" x2="${ex.toFixed(1)}" y1="${m.t - 6}" y2="${Ht - m.b}" stroke="var(--crit-text)" stroke-dasharray="4 3"/><text x="${(ex + 4).toFixed(1)}" y="${m.t + 4}" font-size="10" fill="var(--crit-text)">Earnings${o.earnings_est ? " (est)" : ""}</text>`; }
  }
  return `<svg class="chsvg" viewBox="0 0 ${W} ${Ht}" role="img" aria-label="Implied volatility by expiry">${grid}<polyline fill="none" stroke="var(--amber)" stroke-width="1.5" points="${pts}"/>${em}${dots}</svg>`;
}

function renderOptions() {
  const rows = L.ideas.filter(i => O[i.code]).map(i => ({i, o: O[i.code]}))
    .sort((a, b) => ((a.o.earnings_days ?? 1e9) - (b.o.earnings_days ?? 1e9)) || a.i.code.localeCompare(b.i.code));
  if (!rows.length) { $("#s-op").innerHTML = '<div class="card empty">No options data. Rebuild without <code>--no-options</code>.</div>'; return; }
  const tbl = rows.map(({i, o}) => `<tr><td><b>${esc(i.code)}</b></td><td>${o.earnings_date ? esc(o.earnings_date.slice(5)) + " <span class=\"sub\">(" + o.earnings_days + "d" + (o.earnings_est ? ", est" : "") + ")</span>" : "–"}</td>
    <td>${num(o.term[0].iv, 1)}%</td><td>${o.iv_pre != null ? num(o.iv_pre, 1) + "%" : "–"}</td><td>${o.iv_post != null ? num(o.iv_post, 1) + "%" : "–"}</td>
    <td><b>${impTxt(o)}</b></td><td>${o.hist_avg_abs != null ? "±" + num(o.hist_avg_abs, 1) + "%" : "–"}</td><td style="text-align:left">${ratioTag(o.implied_move_pct, o.hist_avg_abs) || "–"}</td></tr>`).join("");
  $("#s-op").innerHTML = `<h2>Implied volatility around earnings</h2>
    <div class="card scroll"><table><tr><th>Ticker</th><th>Earnings</th><th>Front IV</th><th>IV before</th><th>IV after</th><th>Implied move</th><th>Past avg move</th><th style="text-align:left">Options vs past</th></tr>${tbl}</table></div>
    <div class="note">Implied move: the expected size of the earnings-day move, estimated from the jump in at-the-money implied volatility between the last expiry before the report and the first one after it. A "~" marks a rough estimate (those expiries are far apart) and "est" means Yahoo's projected report date. Past avg move: the average actual close-to-close reaction over the last 8 reports. Rich = options price a bigger move than usually happens; Cheap = smaller. Yahoo option quotes can be stale after hours.</div>
    <h2>IV term structure</h2>
    <div class="chgrid">${rows.map(({i, o}) => `<div class="chcard"><div class="chhd"><span class="tk">${esc(i.code)}</span><span class="px">${usd(i.price)}</span><span class="chg ${cls(i.chg_pct)}">${pct(i.chg_pct)}</span>${ratioTag(o.implied_move_pct, o.hist_avg_abs)}</div>
      <div class="chro">Implied <b>${impTxt(o)}</b> vs past <b>${o.hist_avg_abs != null ? "±" + num(o.hist_avg_abs, 1) + "%" : "–"}</b> · Earnings <b>${o.earnings_date ? esc(o.earnings_date) : "n/a"}</b></div>
      ${ivChart(o)}
      <div class="chro">Past reports: ${o.hist.length ? o.hist.map(h => `<span class="${cls(h.move_pct)}" title="${esc(h.date)}">${pct(h.move_pct)}</span>`).join(" ") : "n/a"}</div></div>`).join("")}</div>`;
}

function renderHist() {
  const days = H.slice(-20), codes = L.watchlist;
  if (!window._hd) window._hd = days[days.length - 1]?.date;
  const sel = H.find(h => h.date === window._hd) || days[days.length - 1];
  const g = `<div class="scroll"><div class="grid" style="grid-template-columns:54px repeat(${days.length},minmax(24px,1fr));min-width:${54 + days.length * 28}px">
    <div></div>${days.map(d => `<div class="hd">${d.date.slice(5).replace("-", "/")}</div>`).join("")}
    ${codes.map(c => `<div class="rl">${esc(c)}</div>` + days.map(d => { const it = d.items.find(x => x.code === c); return it ? `<div class="cell ${it.action}" title="${esc(c + " " + d.date + ": " + it.label)}" aria-label="${esc(c + " " + d.date + " " + it.label)}">${ICON[it.action]}</div>` : '<div class="cell none"></div>'; }).join("")).join("")}</div></div>
    <div class="legend"><span><i class="b-BUY">▲</i>Buy zone</span><span><i class="b-WATCH">◉</i>Watch</span><span><i class="b-WAIT">⏸</i>Wait</span><span><i class="b-AVOID">✕</i>Avoid</span></div>`;
  $("#s-hist").innerHTML = `<h2>Signal timeline (last ${days.length} sessions)</h2><div class="card">${g}</div>
    <h2>Briefing archive</h2><div class="chips" role="group">${H.slice().reverse().slice(0, 60).map(h => `<button class="chip" data-d="${h.date}" aria-pressed="${h.date === sel.date}">${h.date.slice(5)}${h.backfilled ? "*" : ""}</button>`).join("")}</div>
    <div class="card scroll"><div class="sub" style="margin-bottom:6px">${sel.date}${sel.backfilled ? " · reconstructed from price data (quant only, no news/earnings adjustments)" : " · saved briefing"}</div>
    <table><tr><th>Ticker</th><th>Price</th><th>Call</th><th>Entry</th><th>Stop</th><th>Tgt</th></tr>
    ${sel.items.map(it => `<tr><td><b>${esc(it.code)}</b></td><td>${usd(it.price)}</td><td style="text-align:left;white-space:normal">${badge(it.action)}<div class="nm" style="margin-top:2px">${esc(it.label)}</div></td><td>${it.trigger ? "&gt;" + num(it.trigger) : it.entry_low != null ? num(it.entry_low, 0) + "–" + num(it.entry_high, 0) : "–"}</td><td>${num(it.stop)}</td><td>${num(it.target)}</td></tr>`).join("")}</table></div>`;
  $("#s-hist").querySelectorAll(".chip").forEach(b => b.onclick = () => { window._hd = b.dataset.d; renderHist(); });
}

function renderAn() {
  $("#s-an").innerHTML = `<h2>Analyze any US ticker</h2>
    <div class="card"><div class="row"><input type="text" id="sym" placeholder="e.g. AMD" autocapitalize="characters" autocomplete="off" maxlength="7" aria-label="Ticker symbol"><button class="btn" id="go">Analyze</button></div>
      <label class="row" style="margin-top:10px;font-size:13px;color:var(--ink2)"><input type="checkbox" id="useai" style="width:20px;height:20px"> Include AI report (slower, uses your LLM key)</label>
      <div class="sub" style="margin-top:8px">Live analysis needs the local server: <code>python dashboard/serve.py</code>. A hosted copy of this page can't fetch prices on its own.</div></div>
    <div id="anOut"></div>`;
  const run = async () => {
    const sym = $("#sym").value.trim().toUpperCase(); if (!/^[A-Z]{1,5}([.\-][A-Z])?$/.test(sym)) { $("#anOut").innerHTML = '<div class="card empty">Enter a US ticker, e.g. AAPL.</div>'; return; }
    $("#go").disabled = true; $("#anOut").innerHTML = '<div class="card empty">Analyzing ' + esc(sym) + '…</div>';
    try {
      const r = await fetch(`/api/analyze?symbol=${encodeURIComponent(sym)}${$("#useai").checked ? "&ai=1" : ""}`);
      if (!r.ok) throw new Error((await r.json().catch(() => ({}))).error || r.status);
      $("#anOut").innerHTML = card(await r.json(), true);
    } catch (e) {
      $("#anOut").innerHTML = `<div class="card empty">Couldn't analyze ${esc(sym)}: ${esc(e.message)}<br><span class="sub">Is <code>serve.py</code> running? Open this page from it (http://localhost:8765).</span></div>`;
    } finally { $("#go").disabled = false; }
  };
  $("#go").onclick = run; $("#sym").addEventListener("keydown", e => e.key === "Enter" && run());
}

/* ---------- shell ---------- */
const TABS = [["today", "Today", "★", renderToday], ["watch", "Watchlist", "☰", renderWatch], ["ch", "Charts", "▥", renderCharts], ["op", "Options", "◈", renderOptions], ["hist", "History", "◷", renderHist], ["an", "Analyze", "⌕", renderAn]];
function show(id) {
  TABS.forEach(([k]) => $("#s-" + k).classList.toggle("on", k === id));
  $("#tabs").querySelectorAll("button").forEach(b => b.dataset.t === id ? b.setAttribute("aria-current", "page") : b.removeAttribute("aria-current"));
  history.replaceState(null, "", "#" + id); scrollTo(0, 0);
}
function renderAll() { renderRegime(); TABS.forEach(t => t[3]()); }
$("#tabs").innerHTML = TABS.map(([k, n, ic]) => `<button data-t="${k}"><span class="ic" aria-hidden="true">${ic}</span>${n}</button>`).join("");
$("#tabs").onclick = e => { const b = e.target.closest("button"); if (b) show(b.dataset.t); };
function applyTheme() { if (S.theme === "auto") document.documentElement.removeAttribute("data-theme"); else document.documentElement.dataset.theme = S.theme; }
$("#gear").onclick = () => { $("#acct").value = S.acct ?? ""; $("#risk").value = S.risk ?? 1; $("#dlg").showModal(); };
$("#dlg").addEventListener("close", () => { S.acct = parseFloat($("#acct").value) || null; S.risk = Math.min(5, Math.max(0.1, parseFloat($("#risk").value) || 1)); store.set("dsa.settings", S); applyTheme(); renderAll(); });
applyTheme(); renderAll(); show((location.hash || "#today").slice(1).replace(/[^a-z]/g, "") in {today:1,watch:1,ch:1,op:1,hist:1,an:1} ? location.hash.slice(1) : "today");
</script>
</body>
